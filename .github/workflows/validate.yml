name: Validate add-on

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and launcher
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          root = pathlib.Path("timelimit")
          config = yaml.safe_load((root / "config.yaml").read_text())
          assert config["arch"] == ["amd64", "aarch64"]
          assert config["ports"]["8080/tcp"] == 8080
          assert all(k in config["schema"] for k in ("database_url", "mail_sender", "mail_transport"))
          PY
          node --check timelimit/launch.js
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: ./timelimit
          platforms: linux/amd64,linux/arm64
          push: false
          tags: timelimit-ha:test
