name: Smoke test server startup

on:
  pull_request:
  workflow_dispatch:

jobs:
  fresh-database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: timelimit
          MARIADB_USER: timelimit
          MARIADB_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Build wrapper
        run: |
          docker build -t timelimit-ha:test timelimit
          docker run --rm --entrypoint sh timelimit-ha:test -c 'sed -n "20,50p" /usr/src/app/build/database/migration/migrations/20181014-setup-tables.js; sed -n "20,50p" /usr/src/app/build/database/migration/umzug.js'
      - name: Start against a fresh database
        run: |
          mkdir -p /tmp/timelimit-options
          cat > /tmp/timelimit-options/options.json <<'JSON'
          {"database_url":"mariadb://timelimit:testpass@127.0.0.1:3306/timelimit","always_pro":true}
          JSON
          docker run -d --name timelimit-test --network host -v /tmp/timelimit-options:/data:ro timelimit-ha:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              docker logs timelimit-test
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' timelimit-test)" = false ]; then
              docker logs timelimit-test
              exit 1
            fi
            sleep 2
          done
          docker logs timelimit-test
          exit 1
