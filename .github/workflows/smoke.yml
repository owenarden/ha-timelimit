name: Smoke test server startup

on:
  pull_request:
  workflow_dispatch:

jobs:
  fresh-database:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: timelimit
          MARIADB_USER: timelimit
          MARIADB_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Build wrapper and inspect migrations
        run: |
          docker build -t timelimit-ha:test timelimit
          docker run --rm --entrypoint sh timelimit-ha:test -c 'find /usr/src/app/build/database/migration -maxdepth 2 -type f | head -30'
      - name: Start against a fresh database
        run: |
          mkdir -p /tmp/timelimit-options
          cat > /tmp/timelimit-options/options.json <<'JSON'
          {"database_url":"mariadb://timelimit:testpass@127.0.0.1:3306/timelimit","always_pro":true}
          JSON
          docker run --rm --network host -v /tmp/timelimit-options:/data:ro timelimit-ha:test &
          server_pid=$!
          sleep 20
          curl -fsS http://127.0.0.1:8080/ || true
          kill "$server_pid" || true
          wait "$server_pid" || true
